[package]
name = "apiproxy"
version = "0.1.2"
edition = "2024"
description = "simple and local api endpoints proxy"
license = "MIT"

[dependencies]
clap = { version = "=4.6.10", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
] }
axum = "=0.8.9"
reqwest = { version = "=0.13.5", features = ["stream"] }
thiserror = "=2.0.21"
